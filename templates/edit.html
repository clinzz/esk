{% extends "base.html" %}

{% block title %}編輯心得 - 書本閱讀心得記錄{% endblock %}
{% block header_title %}編輯書本心得與筆記{% endblock %}

{% block content %}
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label for="title">欄位 1：書名 (Title)</label>
                <input type="text" id="title" name="title" value="{{ book.title }}" required>
            </div>

            <div class="form-group">
                <label for="author">欄位 2：書作者 (Author)</label>
                <input type="text" id="author" name="author" value="{{ book.author }}" required>
            </div>

            <div class="form-group">
                <label for="content">欄位 3：心得內容 (Content)</label>
                <textarea id="content" name="content" rows="5" style="resize: vertical;" required>{{ book.content }}</textarea>
            </div>

            <div class="form-group">
                <label for="note">欄位 4：筆記 / 紀錄 (Note)</label>
                <textarea id="note" name="note" rows="5" style="resize: vertical;" required>{{ book.note }}</textarea>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn">儲存更新</button>
                <a href="{{ url_for('index') }}" class="cancel-link">取消返回</a>
            </div>
        </form>
    </div>
{% endblock %}
